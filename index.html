<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./css/styles.css">
  <title>My Dashboard</title>
</head>

<body id="index">
  <main class="main">
    <section class="time-container">
      <div class="clock-digital">
        <h1>Son las...</h1>
        <div id="time" class="time"></div>
        <div id="date" class="date"></div>
        <div id="message" class="message"></div>
      </div>
    </section>
    <section>
      <div class="weather">
        <div id="currentWeather" class="currentWeather"></div>
        <ul id="forecastWeather" class="forecastWeather"></ul>
      </div>
    </section>
    <section>
      <div class="pass">
        <div class="title">
          <h2>CREA TU PASSWORD SEGURO</h2>
        </div>
        <div id="passwordForm" class="passwordForm">
          <label for="length">Numero de caracteres de la Contraseña min.12 max.24</label>
          <input type="number" id="length" name="length" min="12" max="24" value="12">
          <button type="button" onclick="generatePassword()">Generar Password</button>
          <div id="passwordResult" class="password-result"></div>
        </div>
      </div>
    </section>
    <section class="list-container">
      <div class="list">
        <div class="title">
          <h2>Añade tu enlace de interés</h2>
          <img src="./images/enlace.png" alt="link">
        </div>
        <div class="input-container">
          <input type="text" id="name-input" placeholder="Nombre de tu enlace" required>
          <input type="text" id="url-input" required placeholder="Pega aquí la URL">
          <button id="add-link-button" class="add-link-button">Guardar enlace</button>
        </div>
        <ul id="links-container" class="links-container"></ul>
      </div>
    </section>
  </main>
  <footer class="footer">
    <nav>
      <a href="./reloj.html"><img src="./images/reloj.png" alt="clock"></a>
      <a href="./password.html"><img src="./images/candado2.png" alt="lock"></a>
      <a href="./links.html"><img src="./images/enlace.png" alt="link"></a>
      <a href="./tiempo.html"><img src="./images/nube.png" alt="cloud"></a>
    </nav>
  </footer>
  <script src="./js/script.js"></script>
  <script src="./js/reloj.js"></script>
  <script src="./js/links.js"></script>
  <script src="./js/tiempo.js"></script>
  <script src="./js/password.js"></script>
</body>

</html>
