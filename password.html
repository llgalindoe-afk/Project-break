<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Generador de Contraseñas</title>
</head>
<body class="pass-page">
  <header class="header">
    <a href="index.html">
      <img src="./images/casa.png" alt="Home"/>
  </a>
  </header>
  <main class="main">
    <div class="pass">
      <div class="title">
        <h2>CREA  TU   PASSWORD   SEGURO</h2>
      </div>
      <div id="passwordForm" class="passwordForm">
        <label for="length">Numero de caracteres de la Contraseña (min.12 max.24)</label>
        <input type="number" id="length" name="length" min="12" max="24" value="12">
        <button type="button" onclick="generatePassword()">Generar Password</button>
        <div id="passwordResult" class="password-result"></div>       
      </div>
    </div>
  </main>
  <footer class="footer">
    <nav>
      <a href="./reloj.html"><img src="./images/reloj.png" alt="clock"></a>
      <a href="./password.html"><img src="./images/candado2.png" alt="lock"></a>
      <a href="./links.html"><img src="./images/enlace.png" alt="link"></a>
      <a href="./tiempo.html"><img src="./images/nube.png" alt="cloud"></a>
    </nav>
  </footer>
  <script src="./js/script.js"></script>
  <script src="./js/password.js"></script>
</body>
</html>
